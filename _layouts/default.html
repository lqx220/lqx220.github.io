<!DOCTYPE html>
<html lang="{{ site.lang | default: "zh-CN" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2a52a0">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
</head>
<body>

  <!-- 粒子背景 -->
  <canvas id="particles-bg"></canvas>

  <div class="container">
    <header class="site-header">
      <div class="wrapper">
        <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
        <nav class="site-nav">
          <div class="trigger">
            <a class="page-link" href="{{ "/" | relative_url }}">首页</a>
            <a class="page-link" href="{{ "/about" | relative_url }}">关于</a>
          </div>
        </nav>
      </div>
    </header>

    <main class="page-content" aria-label="Content">
      <div class="content-wrapper">
        <div class="content-main">
          <div class="wrapper">
            {{ content }}
          </div>
        </div>

        <aside class="content-sidebar">
          <div class="sidebar">
            <h3>文章分类</h3>
            <ul>
              {% assign categories = site.categories | sort %}
              {% for category in categories %}
                <li>
                  <a href="#{{ category[0] | slugize }}">
                    {{ category[0] }}
                    <span class="category-count">({{ category[1].size }})</span>
                  </a>
                </li>
              {% endfor %}
            </ul>
          </div>
        </aside>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title | escape }} &nbsp;·&nbsp; φ = 1.618</p>
      </div>
    </footer>
  </div>

  <script>
    (function() {
      var c = document.getElementById('particles-bg');
      if (!c) return;
      var ctx = c.getContext('2d');
      function resize() { c.width = window.innerWidth; c.height = window.innerHeight; }
      resize();
      window.addEventListener('resize', resize);
      var dots = Array.from({length: 55}, function() { return {
        x: Math.random() * c.width, y: Math.random() * c.height,
        r: Math.random() * 1.3 + 0.4,
        vx: (Math.random() - 0.5) * 0.22, vy: (Math.random() - 0.5) * 0.22,
        o: Math.random() * 0.18 + 0.06
      }; });
      function draw() {
        ctx.clearRect(0, 0, c.width, c.height);
        dots.forEach(function(d) {
          d.x += d.vx; d.y += d.vy;
          if (d.x < 0) d.x = c.width; if (d.x > c.width) d.x = 0;
          if (d.y < 0) d.y = c.height; if (d.y > c.height) d.y = 0;
          ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(42,82,160,' + d.o + ')'; ctx.fill();
        });
        dots.forEach(function(a, i) {
          dots.slice(i + 1).forEach(function(b) {
            var dist = Math.hypot(a.x - b.x, a.y - b.y);
            if (dist < 95) {
              ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
              ctx.strokeStyle = 'rgba(42,82,160,' + (0.045 * (1 - dist / 95)) + ')';
              ctx.lineWidth = 0.5; ctx.stroke();
            }
          });
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>

</body>
</html>
